name: Probe
on: workflow_dispatch

jobs:
  probe:
    runs-on: macos-latest
    steps:
      - name: Runner facts
        run: |
          sw_vers
          echo "--- disk ---"
          df -h / /System/Volumes/Data 2>/dev/null || df -h
          echo "--- cpu/mem ---"
          sysctl -n hw.ncpu
          echo "$(( $(sysctl -n hw.memsize) / 1024 / 1024 / 1024 )) GB RAM"
          echo "--- xcode ---"
          ls /Applications | grep -i xcode || true
